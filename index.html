<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurator</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        select {
            width: 200px;
            padding: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <script>
      $(function(){
       function przelicz(){
        let suma = 0;
        let raty = Number($("#raty").val());
        let budzet = $("#budzet").val().trim();

        $("#zestaw").empty();
        $("#blad").text("");
        $("#ostrzezenie").text("");

        $(".czesc option:selected").each(function(){
            if($(this).val() != ""){
                suma += Number($(this).attr("data-cena"));
            }
        });

        $(".dodatek:checked").each(function(){
            suma += Number($(this).attr("data-cena"));
        });

        $("#suma").text("Suma za wszystkie elementy: " + suma + " zł");
        $("#rata").text("Rata miesieczna: " + (suma / raty).toFixed(2) + " zl");


        $(".czesc option:selected").each(function(){
            if($(this).val() != ""){
                $("#zestaw").append("<li>" + $(this).val() + "</li>");
            }   
        });

        $(".dodatek:checked").each(function(){
            $("#zestaw").append("<li>" + $(this).val() + "</li>");
         }); 
        if(budzet != ""){
            if(isNaN(budzet) || Number(budzet) <= 0){
                $("#blad").text("Budzet musi byc liczba").css("color", "red");
            } else if(suma > Number(budzet)){
                $("#ostrzezenie").text("Przekroczono budzet").css("color", "red");
            }
        }

       }
       function ustaw(cpu,motherboard,psu,gpu,ram,dysk, dodatki = []){
            $("#cpu").val(cpu)
            $("#motherboard").val(motherboard)
            $("#psu").val(psu)
            $("#gpu").val(gpu)
            $("#ram").val(ram)
            $("#dysk").val(dysk)
            $(".dodatek").prop("checked",false)

            dodatki.forEach(function(nazwa) {
                $('.dodatek[value="' + nazwa + '"]').prop("checked", true);
            });
        }
        $(".czesc, .dodatek, #raty").change(function(){
            przelicz();    
        });

        $("#budzet").on("input", function(){
            przelicz();
        });
        
        $("#gpu").change(function(){
            let obrazek = $("#gpu option:selected").attr("data-img");
            $("#podglad").attr("src", "img/" + obrazek);
        });

        $("#reset").click(function(){
            $("select").each(function(){
                $(this).prop("selectedIndex", 0).change();
            });
            $(".dodatek").prop("checked", false);
            $("#budzet").val("");
            $("#podglad").attr("src", "");
        });
        
        $("#biuro").click(function() {
        ustaw(
            "Intel i3 - 450 zl",
            "Gigabyte H610M (Intel) - 350 zl",
            "SilentiumPC Elementum E2 550W - 220 zl",
            "RTX 4060 - 1400 zl", 
            "16 GB RAM - 250 zl",
            "SSD 512 GB - 200 zl",
            ["Monitor - 900 zl", "Klawiatura - 250 zl", "Mysz - 150 zl"]
            );
            przelicz()
        });

        $("#gaming").click(function() {
            ustaw(
                "Ryzen 5 - 950 zl",
                "ASUS TUF Gaming B650-PLUS (AMD) - 850 zl",
                "Corsair RM750e 750W Gold - 520 zl",
                "RTX 4070 - 2800 zl",
                "32 GB RAM - 480 zl",
                "SSD 1 TB - 350 zl",
                ["Monitor - 900 zl", "Klawiatura - 250 zl", "Mysz - 150 zl", "Sluchawki - 200 zl"]
            );
            przelicz()
        });

        $("#streaming").click(function() {
            ustaw(
                "Intel i7 - 1750 zl",
                "MSI MAG Z790 Tomahawk (Intel) - 1150 zl",
                "Pure Power 12 M 850W Gold - 650 zl",
                "RTX 4090 - 8500 zl",
                "64 GB RAM - 950 zl",
                "SSD 2 TB - 650 zl",
                ["Monitor - 900 zl", "Klawiatura - 250 zl", "Mysz - 150 zl", "Sluchawki - 200 zl", "Kamera - 180 zl"]
            );
            przelicz()
        });
        
    });
    </script>
    <button type="button" id="biuro">Biuro</button>
    <button type="button" id="gaming">Gaming</button>
    <button type="button" id="streaming">Streaming</button>
    <label for="cpu">Wybierz procesor:</label>
    <select id="cpu" class="czesc">
        <option value=""></option>
        <option value="Intel i3 - 450 zl" data-cena="450">Intel i3 - 450 zl</option>
        <option value="Intel i5 - 850 zl" data-cena="850">Intel i5 - 850 zl</option>
        <option value="Ryzen 5 - 950 zl" data-cena="950">Ryzen 5 - 950 zl</option>
        <option value="Ryzen 7 - 1450 zl" data-cena="1450">Ryzen 7 - 1450 zl</option>
        <option value="Intel i7 - 1750 zl" data-cena="1750">Intel i7 - 1750 zl</option>
    </select>
    <label for="motherboard">Wybierz plyte glowna:</label>
    <select id="motherboard" class="czesc">
        <option value=""></option>
        <option value="Gigabyte H610M (Intel) - 350 zl" data-cena="350" data-base="Intel">Gigabyte H610M (Intel) - 350 zl</option>
        <option value="ASRock B550M Pro4 (AMD) - 450 zl" data-cena="450" >ASRock B550M Pro4 (AMD) - 450 zl</option>
        <option value="MSI B760 Gaming Plus (Intel) - 650 zl" data-cena="650" data-base="Intel">MSI B760 Gaming Plus (Intel) - 650 zl</option>
        <option value="ASUS TUF Gaming B650-PLUS (AMD) - 850 zl" data-cena="850" data-base="AMD">ASUS TUF Gaming B650-PLUS (AMD) - 850 zl</option>
        <option value="MSI MAG Z790 Tomahawk (Intel) - 1150 zl" data-cena="1150" data-base="Intel">MSI MAG Z790 Tomahawk (Intel) - 1150 zl</option>
    </select>
    <label for="psu">Wybierz zasilacz:</label>
    <select id="psu" class="czesc">
        <option value=""></option>
        <option value="SilentiumPC Elementum E2 550W - 220 zl" data-cena="220" data-power="550">SilentiumPC Elementum E2 550W - 220 zl</option>
        <option value="System Power 10 650W - 320 zl" data-cena="320" data-power="650">System Power 10 650W - 320 zl</option>
        <option value="ENDORFY Vero L5 Bronze 700W - 350 zl" data-cena="350" data-power="700">ENDORFY Vero L5 Bronze 700W - 350 zl</option>
        <option value="Corsair RM750e 750W Gold - 520 zl" data-cena="520" data-power="750">Corsair RM750e 750W Gold - 520 zl</option>
        <option value="Pure Power 12 M 850W Gold - 650 zl" data-cena="650" data-power="850">Pure Power 12 M 850W Gold - 650 zl</option>
    </select>

    <br>
    <label for="gpu">Wybierz kartę graficzną:</label>
    <select id="gpu" class="czesc">
        <option value=""></option>
        <option value="RTX 4060 - 1400 zl" data-cena="1400" data-img="RTX4060.png" data-neededpower="550">RTX 4060 - 1400 zl</option>
        <option value="RTX 4070 - 2800 zl" data-cena="2800" data-img="RTX4070.png" data-neededpower="650">RTX 4070 - 2800 zl</option>
        <option value="RTX 4080 - 4600 zl" data-cena="4600" data-img="RTX4080.png" data-neededpower="750">RTX 4080 - 4600 zl</option>
        <option value="RTX 4090 - 8500 zl" data-cena="8500" data-img="RTX4090.png" data-neededpower="850">RTX 4090 - 8500 zl</option>
    </select>
    <br>
    <label for="ram">Wybierz pamięć RAM:</label>
    <select id="ram" class="czesc">
        <option value=""></option>
        <option value="8 GB RAM - 150 zl" data-cena="150">8 GB - 150 zl</option>
        <option value="16 GB RAM - 250 zl" data-cena="250">16 GB - 250 zl</option>
        <option value="32 GB RAM - 480 zl" data-cena="480">32 GB - 480 zl</option>
        <option value="64 GB RAM - 950 zl" data-cena="950">64 GB - 950 zl</option>
        <option value="128 GB RAM - 1800 zl" data-cena="1800">128 GB - 1800 zl</option>
    </select>
    <br>
    <label for="dysk">Wybierz dysk:</label>
    <select id="dysk" class="czesc">
        <option value=""></option>
        <option value="SSD 256 GB - 130 zl" data-cena="130">SSD 256 GB - 130 zl</option>
        <option value="SSD 512 GB - 200 zl" data-cena="200">SSD 512 GB - 200 zl</option>
        <option value="SSD 1 TB - 350 zl" data-cena="350">SSD 1 TB - 350 zl</option>
        <option value="SSD 2 TB - 650 zl" data-cena="650">SSD 2 TB - 650 zl</option>
        <option value="SSD 4 TB - 1200 zl" data-cena="1200">SSD 4 TB - 1200 zl</option>
    </select>
    <br>
    <label for="dodatki">Wybierz dodatki:</label><br>
        <input type="checkbox" class="dodatek" value="Monitor - 900 zl" data-cena="900">Monitor - 900 zl <br>
        <input type="checkbox" class="dodatek" value="Klawiatura - 250 zl" data-cena="250">Klawiatura - 250 zl <br>
        <input type="checkbox" class="dodatek" value="Mysz - 150 zl" data-cena="150">Mysz - 150 zl <br>
        <input type="checkbox" class="dodatek" value="Sluchawki - 200 zl" data-cena="200">Sluchawki - 200 zl <br>
        <input type="checkbox" class="dodatek" value="Kamera - 180 zl" data-cena="180">Kamera - 180 zl <br>

    <br>
    <img id="podglad" src="" width="300">
    <br>
    <p id="suma"></p>
    <h1>Twoj zestaw</h1>
    <ul id="zestaw"></ul>
    <br>
    <label for="raty">Wybierz ilosc rat:</label>
    <select id="raty">
        <option value="1">1</option>
        <option value="6">6</option>
        <option value="12">12</option>
        <option value="24">24</option>
    </select>
    <p id="rata">Rata miesieczna: 0.00 zl</p>
    <br>
    <label for="budzet">Podaj swoj budzet:</label>
    <input type="text" id="budzet">

    <p id="blad"></p>
    <p id="ostrzezenie"></p>
    <button type="button" id="reset">Resetuj konfiguracje</button>
</body>
</html>
